# Orquestación de ApiFestivos + ApiCalendarioLaboral (Examen 2)
# Los container_name coinciden con los usados en el código:
#   - bd.config.js        -> SERVIDOR: 'dockerbdfestivos'
#   - FestivoCliente.java -> http://dockerapifestivos:3030/...

services:
  dockerbdfestivos:
    image: mongo
    container_name: dockerbdfestivos
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: festivos
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redcalendario

  dockerapifestivos:
    build: ./ITM_SE_Proyecto_apiFestivos-main/apifestivos
    image: dockerapifestivos
    container_name: dockerapifestivos
    ports:
      - "3030:3030"
    depends_on:
      dockerbdfestivos:
        condition: service_healthy
    networks:
      - redcalendario

  dockerbdcalendario:
    image: postgres
    container_name: dockerbdcalendario
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "123456!"
      POSTGRES_DB: calendariolaboral
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendariolaboral"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redcalendario

  dockerapicalendario:
    build: ./ITM_SE_Proyecto_apiCalendarioLaboral-main/apicalendariolaboral
    image: dockerapicalendario
    container_name: dockerapicalendario
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dockerbdcalendario:5432/calendariolaboral
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456!"
    depends_on:
      dockerbdcalendario:
        condition: service_healthy
      dockerapifestivos:
        condition: service_started
    networks:
      - redcalendario

networks:
  redcalendario:
    name: redcalendario
    driver: bridge

volumes:
  mongo-data:
  postgres-data:
